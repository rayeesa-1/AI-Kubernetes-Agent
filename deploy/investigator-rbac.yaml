apiVersion: v1
kind: Namespace
metadata:
  name: ai-investigator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evidence-reader
  namespace: ai-investigator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-evidence-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-evidence-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-evidence-reader
subjects:
  - kind: ServiceAccount
    name: evidence-reader
    namespace: ai-investigator
